[build]
  command = "npm --prefix client install && npm --prefix server install && npm --prefix client run build"
  publish = "client/dist"
  functions = "server/netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--no-audit --no-fund --legacy-peer-deps"

# API requests are handled by the Netlify Function (must come BEFORE the SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single-page-app fallback (deep links resolve to index.html)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
